    showticklabels: false, zeroline: false, gridcolor: C.grid, showbackground: false, linecolor: C.axis, showspikes: false,
  });
  layout[scene] = { domain: { x: [x0, x1], y: [y0, y1] }, xaxis: axis(0), yaxis: axis(1), zaxis: axis(2),
                     aspectmode: "cube", bgcolor: C.surface };
  layout.annotations.push({ text: p.title, x: x0, y: y1 + 0.012, xref: "paper", yref: "paper", xanchor: "left",
                             yanchor: "bottom", showarrow: false, font: { color: C.ink, size: 13 } });
  D.classes.forEach((name, c) => {
    const idx = [];
    D.labels.forEach((l, j) => { if (l === c) idx.push(j); });
    pointTraces.push(traces.length);
    traces.push({
      type: "scatter3d", mode: "markers", scene, name, showlegend: false, visible: false,
      x: idx.map((j) => p.points[j][0]), y: idx.map((j) => p.points[j][1]), z: idx.map((j) => p.points[j][2]),
      marker: { size: 2.5, color: D.colors[c], opacity: 0.4 },
      customdata: idx.map((j) => [D.query[j], D.classes[D.answer[j]], D.classes[D.pred[j]]]),
      hovertemplate: "%{customdata[0]}<br>correct: %{customdata[1]} · talkie: %{customdata[2]}<extra></extra>",
    });
  });
  traces.push({
    type: "scatter3d", mode: "lines", scene, showlegend: false, hoverinfo: "skip",
    x: p.curve.map((v) => v[0]), y: p.curve.map((v) => v[1]), z: p.curve.map((v) => v[2]),
    line: { color: C.ink2, width: 5 },
  });
  D.classes.forEach((name, c) => {
    traces.push({
      type: "scatter3d", mode: "markers+text", scene, name, legendgroup: name, showlegend: i === 0,
      x: [p.centroids[c][0]], y: [p.centroids[c][1]], z: [p.centroids[c][2]],
      marker: { size: 8, color: D.colors[c], line: { color: C.surface, width: 2 } },
      text: [D.short[c]], textposition: "top center", textfont: { color: C.ink, size: 12 },
      hovertemplate: name + " centroid<extra></extra>",
    });
  });
});
document.getElementById("plot").style.height =
  Math.max(window.innerHeight - document.querySelector("header").offsetHeight - 8, rows * 300) + "px";
Plotly.newPlot("plot", traces, layout, { responsive: true, displaylogo: false });
document.getElementById("showPoints").addEventListener("change", (e) => {
  Plotly.restyle("plot", { visible: e.target.checked }, pointTraces);
});
</script>
